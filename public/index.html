<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  body{margin:0;}
  :root{
    --ink:#22282f; --ink-soft:#5c6570; --paper:#f6f5f1; --card:#ffffff;
    --line:#e2e0d8; --line-strong:#c9c6ba;
    --teal:#0f6e56; --teal-bg:#e1f5ee; --teal-line:#5dcaa5;
    --amber:#854f0b; --amber-bg:#faeeda; --amber-line:#ef9f27;
    --coral:#993c1d; --coral-bg:#faece7; --coral-line:#f0997b;
    --slate:#444441; --slate-bg:#f1efe8;
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#ece9e2; --ink-soft:#a7a396; --paper:#1c1c1a; --card:#242422;
      --line:#3a3935; --line-strong:#4c4b45;
      --teal-bg:#0b2b23; --amber-bg:#2c2007; --coral-bg:#301709; --slate-bg:#2c2c2a;
    }
  }
  *{box-sizing:border-box;}
  #tt-root{font-family:var(--font-body);color:var(--ink);background:var(--paper);padding:1.5rem;border-radius:14px;max-width:1100px;margin:0 auto;}
  #tt-root h1,#tt-root h2,#tt-root h3{font-family:var(--font-display);font-weight:600;margin:0;}
  #tt-root button{font-family:var(--font-body);cursor:pointer;}
  #tt-root input,#tt-root textarea,#tt-root select{font-family:var(--font-body);}
  .tt-btn{background:transparent;border:0.5px solid var(--line-strong);border-radius:8px;padding:7px 13px;font-size:13px;color:var(--ink);transition:transform 0.1s ease, background 0.12s ease;}
  .tt-btn:hover{background:var(--slate-bg);}
  .tt-btn:active{transform:scale(0.97);}
  .tt-btn-primary{background:var(--ink);color:var(--paper);border:0.5px solid var(--ink);}
  .tt-btn-primary:hover{opacity:.88;background:var(--ink);}
  .tt-input,.tt-textarea,.tt-select{width:100%;border:0.5px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:14px;background:var(--card);color:var(--ink);}
  .tt-input:focus,.tt-textarea:focus,.tt-select:focus{outline:2px solid var(--teal-line);outline-offset:1px;}
  .tt-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:20px;font-family:var(--font-mono);}
  @keyframes ttpulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(.6);}}
  .tt-pulse{animation:ttpulse 1.2s ease-in-out infinite;}
</style>
</head>
<body>

<div id="tt-root">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.25rem;flex-wrap:wrap;gap:12px;">
    <div>
      <p style="font-size:11px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;margin:0 0 4px;font-family:var(--font-mono);">Manager check-in ledger</p>
      <h1 style="font-size:26px;">Task board</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="tt-btn" id="tt-people-btn">Colleagues</button>
      <button class="tt-btn tt-btn-primary" id="tt-add-btn">+ New task</button>
    </div>
  </div>

  <div id="tt-board" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:1.75rem;"></div>

  <div style="border-top:0.5px solid var(--line);padding-top:2rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;flex-wrap:wrap;gap:8px;">
      <h2 style="font-size:17px;">Daily report</h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <select id="tt-report-date" class="tt-select" style="width:auto;font-size:13px;padding:6px 8px;"></select>
        <button class="tt-btn" id="tt-copy-report">Copy</button>
        <button class="tt-btn" id="tt-download-report">Download .docx</button>
      </div>
    </div>
    <pre id="tt-report-box" style="background:var(--card);border:0.5px solid var(--line);border-radius:10px;padding:14px 16px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;color:var(--ink);margin:0;"></pre>
    <p style="font-size:12px;color:var(--ink-soft);margin:8px 0 0;">This report is built from tasks marked done, whenever you open this board. It won't send itself anywhere on a schedule — copy or download it when you're ready to share it.</p>
  </div>
</div>

<div id="tt-modal-layer"></div>

<script>
(function(){
  const STORAGE_KEY = 'tasks';
  let tasks = [];
  let people = [];
  const COLS = [
    {key:'todo', label:'To do', bg:'var(--card)', border:'var(--line)'},
    {key:'inprogress', label:'In progress', bg:'var(--amber-bg)', border:'var(--amber-line)'},
    {key:'done', label:'Done', bg:'var(--teal-bg)', border:'var(--teal-line)'}
  ];
  const PRIORITIES = [
    {key:'urgent', label:'Urgent', color:'#d64545'},
    {key:'high',   label:'High',   color:'#e08a3c'},
    {key:'medium', label:'Medium', color:'#d9b038'},
    {key:'low',    label:'Low',    color:'#4a9d6e'}
  ];
  const PRIORITY_ORDER = {urgent:0, high:1, medium:2, low:3};
  const PRIORITY_BORDER_COLORS = {
    urgent: '#d64545', high: '#e08a3c', medium: '#d9b038', low: '#4a9d6e'
  };
  function priorityOf(task){ return PRIORITIES.some(p=>p.key===task.priority) ? task.priority : 'medium'; }
  function priorityMeta(task){ const k=priorityOf(task); return PRIORITIES.find(p=>p.key===k); }

  function uid(){ return 't' + Math.random().toString(36).slice(2,10); }
  function todayStr(d){ const dt = d || new Date(); return dt.toISOString().slice(0,10); }
  function fmtDate(s){ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
  function fmtTime(iso){ return new Date(iso).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }

  async function loadTasks(){
    try{
      const res = await fetch('/api/tasks');
      tasks = await res.json();
    }catch(e){ tasks = []; }
    render();
  }
  async function saveTasks(){
    try{
      await fetch('/api/tasks', {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(tasks)
      });
    }catch(e){ console.error('Storage error', e); }
  }
  async function loadPeople(){
    try{
      const res = await fetch('/api/people');
      people = await res.json();
    }catch(e){ people = []; }
  }
  function personById(id){ return people.find(p=>p.id===id); }
  function hasExternalBlock(task){ return !!(task.externalDependency && !task.externalDependency.resolvedAt); }

  async function flagDependency(taskId, personId, note, statusEl){
    try{
      const res = await fetch(`/api/tasks/${taskId}/flag-dependency`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ personId, note })
      });
      const data = await res.json();
      if(!res.ok){
        statusEl.style.color='var(--coral)';
        statusEl.textContent = data.error || 'Could not flag dependency.';
        return { ok:false };
      }
      const t = tasks.find(x=>x.id===taskId);
      if(t) t.externalDependency = data.task.externalDependency;
      if(data.emailed){
        statusEl.style.color='var(--teal)';
        statusEl.textContent = `Emailed ${personById(personId)?.name || 'colleague'}`;
      } else {
        statusEl.style.color='var(--coral)';
        statusEl.textContent = "Saved, but the email didn't send — check your SMTP settings.";
      }
      render();
      return { ok:true, emailed:data.emailed };
    }catch(e){
      statusEl.style.color='var(--coral)';
      statusEl.textContent = 'Network error — could not flag dependency.';
      return { ok:false };
    }
  }

  async function resolveDependency(taskId){
    try{
      const res = await fetch(`/api/tasks/${taskId}/resolve-dependency`, { method:'POST' });
      const data = await res.json();
      const t = tasks.find(x=>x.id===taskId);
      if(t && data.task) t.externalDependency = data.task.externalDependency;
      render();
    }catch(e){ console.error('Resolve failed', e); }
  }

  // --- Dependency chain ---
  async function chainAction(url, body, taskId){
    try{
      const res = await fetch(url, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body||{})
      });
      const data = await res.json();
      if(!res.ok) return { ok:false, error:data.error };
      const t = tasks.find(x=>x.id===taskId);
      if(t && data.task) t.chain = data.task.chain;
      render();
      return { ok:true };
    }catch(e){ return { ok:false, error:'Network error' }; }
  }
  function setChain(taskId, chain){ return chainAction(`/api/tasks/${taskId}/chain`, { chain }, taskId); }
  function advanceChain(taskId, note){ return chainAction(`/api/tasks/${taskId}/chain/advance`, note?{note}:{}, taskId); }
  function resolveBlocker(taskId){ return chainAction(`/api/tasks/${taskId}/chain/resolve-blocker`, {}, taskId); }

  function fmtDuration(ms){
    if(ms < 0) ms = 0;
    const min = Math.round(ms/60000);
    if(min < 1) return 'just now';
    if(min < 60) return `${min}m`;
    const hrs = Math.floor(min/60), rem = min%60;
    if(hrs < 24) return rem ? `${hrs}h ${rem}m` : `${hrs}h`;
    const days = Math.floor(hrs/24), rh = hrs%24;
    return rh ? `${days}d ${rh}h` : `${days}d`;
  }
  function stageName(stage){ return stage.label || personById(stage.personId)?.name || 'Stage'; }

  function renderStage(task, stage){
    const col = document.createElement('div');
    col.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;max-width:112px;';
    const node = document.createElement('div');
    node.style.cssText = 'width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto;';
    let caption = '';
    if(stage.status==='done'){
      node.style.background='var(--teal)'; node.style.color='#fff'; node.textContent='✓';
      if(stage.startedAt && stage.completedAt) caption = fmtDuration(new Date(stage.completedAt)-new Date(stage.startedAt));
    } else if(stage.status==='current' || stage.status==='blocked'){
      node.style.background='#d64545'; node.style.color='#fff';
      const dot = document.createElement('span');
      dot.style.cssText='width:9px;height:9px;border-radius:50%;background:#fff;';
      if(stage.status==='current') dot.className='tt-pulse';
      node.appendChild(dot);
      if(stage.startedAt) caption = fmtDuration(Date.now()-new Date(stage.startedAt)) + ' elapsed';
    } else {
      node.style.background='transparent'; node.style.border='2px solid var(--line-strong)'; node.style.color='var(--ink-soft)';
      caption = 'not started';
    }
    col.appendChild(node);
    const name = document.createElement('div');
    name.style.cssText = `font-size:11px;font-weight:500;text-align:center;color:${stage.status==='pending'?'var(--ink-soft)':'var(--ink)'};`;
    name.textContent = stageName(stage);
    col.appendChild(name);
    if(caption){
      const cap = document.createElement('div');
      cap.style.cssText='font-size:10px;font-family:var(--font-mono);color:var(--ink-soft);text-align:center;';
      cap.textContent = caption;
      col.appendChild(cap);
    }
    if(stage.status==='blocked' && stage.note){
      const callout = document.createElement('div');
      callout.style.cssText='font-size:10.5px;background:var(--coral-bg);color:var(--coral);border-radius:6px;padding:4px 6px;margin-top:2px;text-align:center;max-width:112px;';
      callout.textContent = '"'+stage.note+'"';
      col.appendChild(callout);
    }
    if(stage.status==='current'){
      const adv = document.createElement('button');
      adv.className='tt-btn'; adv.style.cssText='font-size:10px;padding:3px 6px;margin-top:2px;';
      adv.textContent='Pass on ✓';
      adv.onclick=()=>advanceChain(task.id);
      col.appendChild(adv);
      const blk = document.createElement('button');
      blk.className='tt-btn'; blk.style.cssText='font-size:10px;padding:3px 6px;color:var(--coral);';
      blk.textContent='Flag blocked';
      blk.onclick=()=>{ const note=prompt('What is blocking this stage?'); if(note && note.trim()) advanceChain(task.id, note.trim()); };
      col.appendChild(blk);
    } else if(stage.status==='blocked'){
      const rb = document.createElement('button');
      rb.className='tt-btn'; rb.style.cssText='font-size:10px;padding:3px 6px;margin-top:2px;';
      rb.textContent='Resolve';
      rb.onclick=()=>resolveBlocker(task.id);
      col.appendChild(rb);
    }
    return col;
  }

  function renderChainBar(task){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px 2px;';
    const chain = task.chain || [];
    chain.forEach((stage, i)=>{
      if(i>0){
        const line = document.createElement('div');
        const solid = chain[i-1].status==='done';
        line.style.cssText = `flex:1;min-width:20px;height:0;margin-top:14px;border-top:2px ${solid?'solid':'dashed'} ${solid?'var(--teal-line)':'var(--line-strong)'};`;
        wrap.appendChild(line);
      }
      wrap.appendChild(renderStage(task, stage));
    });
    return wrap;
  }

  function isBlocked(task){
    return (task.dependsOn||[]).some(id=>{
      const dep = tasks.find(t=>t.id===id);
      return dep && dep.status !== 'done';
    });
  }
  function blockers(task){
    return (task.dependsOn||[]).map(id=>tasks.find(t=>t.id===id)).filter(t=>t && t.status!=='done');
  }

  function taskCard(task){
    const blocked = isBlocked(task);
    const blockList = blockers(task);
    const prio = priorityMeta(task);
    const isDone = task.status === 'done';
    const cardBg = isDone ? 'var(--slate-bg)' : 'var(--card)';
    const card = document.createElement('div');
    card.style.cssText = `background:${cardBg};border:0.5px solid var(--line);border-left:3px solid ${PRIORITY_BORDER_COLORS[task.priority||'medium']};border-radius:10px;padding:10px 12px;margin-bottom:8px;`;
    let html = `<div style="display:flex;align-items:center;gap:6px;margin:0 0 8px;">`
      + `<span class="tt-chip" style="background:transparent;border:0.5px solid ${prio.color};color:${prio.color};">`
      + `<span style="width:7px;height:7px;border-radius:50%;background:${prio.color};display:inline-block;"></span>${prio.label}</span></div>`;
    html += `<p style="font-size:14px;font-weight:500;margin:0 0 4px;">${escapeHtml(task.title)}</p>`;
    if(task.notes) html += `<p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 8px;">${escapeHtml(task.notes)}</p>`;
    if(blocked){
      html += `<div class="tt-chip" style="background:var(--coral-bg);color:var(--coral);margin-bottom:6px;">blocked by ${blockList.map(b=>escapeHtml(b.title)).join(', ')}</div><br/>`;
    } else if((task.dependsOn||[]).length){
      html += `<div class="tt-chip" style="background:var(--teal-bg);color:var(--teal);margin-bottom:6px;">dependencies clear</div><br/>`;
    }
    if(task.status==='done' && task.completedAt){
      html += `<p style="font-size:11px;font-family:var(--font-mono);color:var(--ink-soft);margin:0 0 8px;">done ${fmtTime(task.completedAt)} · ${todayStr(new Date(task.completedAt))===todayStr()?'today':fmtDate(todayStr(new Date(task.completedAt)))}</p>`;
    }
    card.innerHTML = html;

    if(hasExternalBlock(task)){
      const person = personById(task.externalDependency.personId);
      const chip = document.createElement('button');
      chip.className = 'tt-chip';
      chip.style.cssText = 'background:#efe7fb;color:#6b3fc0;border:0.5px solid #b79ce8;margin-bottom:8px;cursor:pointer;';
      chip.textContent = `⏳ waiting on ${person ? person.name : 'a colleague'}`;
      chip.onclick = ()=>openDependencyModal(task.id);
      card.appendChild(chip);
      card.appendChild(document.createElement('br'));
    }

    if(Array.isArray(task.chain) && task.chain.length){
      const doneCount = task.chain.filter(s=>s.status==='done').length;
      const active = task.chain.find(s=>s.status==='current' || s.status==='blocked');
      const who = active ? `${stageName(active)} has it${active.status==='blocked'?' — blocked':''}` : 'complete';
      const summary = document.createElement('button');
      summary.className='tt-btn';
      summary.style.cssText='font-size:11px;padding:4px 8px;margin-bottom:6px;display:block;width:100%;text-align:left;';
      summary.textContent = `⛓ Chain ${doneCount}/${task.chain.length} · ${who}`;
      const barWrap = document.createElement('div');
      barWrap.style.cssText='display:none;margin-bottom:6px;';
      summary.onclick=()=>{
        const open = barWrap.style.display!=='none';
        barWrap.style.display = open ? 'none' : 'block';
        if(!open){ barWrap.innerHTML=''; barWrap.appendChild(renderChainBar(task)); }
      };
      card.appendChild(summary);
      card.appendChild(barWrap);
    }

    const controls = document.createElement('div');
    controls.style.cssText = 'display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;';
    COLS.forEach(c=>{
      if(c.key===task.status) return;
      const b = document.createElement('button');
      b.className='tt-btn';
      b.style.cssText='font-size:11px;padding:4px 8px;';
      b.textContent = (task.status==='done' && c.key==='todo') ? '↺ Reopen' : ('→ ' + c.label);
      if(c.key==='done' && blocked){
        b.title = 'Still blocked by an unfinished dependency';
        b.style.opacity='0.55';
      }
      b.onclick = ()=>{
        task.status = c.key;
        task.completedAt = c.key==='done' ? new Date().toISOString() : null;
        saveTasks(); render();
      };
      controls.appendChild(b);
    });
    const edit = document.createElement('button');
    edit.className='tt-btn';
    edit.style.cssText='font-size:11px;padding:4px 8px;';
    edit.textContent='Edit';
    edit.onclick = ()=>openModal(task.id);
    controls.appendChild(edit);
    const del = document.createElement('button');
    del.className='tt-btn';
    del.style.cssText='font-size:11px;padding:4px 8px;color:var(--coral);';
    del.textContent='Remove';
    del.onclick = ()=>{
      tasks = tasks.filter(t=>t.id!==task.id);
      tasks.forEach(t=>{ t.dependsOn = (t.dependsOn||[]).filter(id=>id!==task.id); });
      saveTasks(); render();
    };
    controls.appendChild(del);
    card.appendChild(controls);
    return card;
  }

  function escapeHtml(s){
    const d=document.createElement('div'); d.textContent = s||''; return d.innerHTML;
  }

  function render(){
    const board = document.getElementById('tt-board');
    board.innerHTML = '';
    COLS.forEach(col=>{
      const colEl = document.createElement('div');
      colEl.style.cssText = `background:${col.bg==='var(--card)'?'var(--slate-bg)':col.bg};border-radius:12px;padding:10px;min-height:80px;max-height:70vh;overflow-y:auto;`;
      const items = tasks.filter(t=>t.status===col.key).sort((a,b)=>{
        const pa=PRIORITY_ORDER[priorityOf(a)], pb=PRIORITY_ORDER[priorityOf(b)];
        if(pa!==pb) return pa-pb;
        return (a.createdAt||'').localeCompare(b.createdAt||'');
      });
      colEl.innerHTML = `<p style="font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 8px;font-family:var(--font-mono);">${col.label} · ${items.length}</p>`;
      if(!items.length){
        const empty = document.createElement('p');
        empty.style.cssText='font-size:12.5px;color:var(--ink-soft);margin:0;';
        const EMPTY_TEXT = {
          todo: "Nothing queued. Add what's next.",
          inprogress: 'Nothing active right now.',
          done: "Nothing finished yet — it'll show up here."
        };
        empty.textContent = EMPTY_TEXT[col.key] || 'Nothing here yet.';
        colEl.appendChild(empty);
      }
      items.forEach(t=>colEl.appendChild(taskCard(t)));
      board.appendChild(colEl);
    });
    renderReportControls();
    renderReport();
  }

  function completionDates(){
    const set = new Set();
    tasks.forEach(t=>{ if(t.completedAt) set.add(todayStr(new Date(t.completedAt))); });
    set.add(todayStr());
    return Array.from(set).sort().reverse();
  }

  function renderReportControls(){
    const sel = document.getElementById('tt-report-date');
    const prev = sel.value;
    const dates = completionDates();
    sel.innerHTML = dates.map(d=>`<option value="${d}">${d===todayStr()?'Today · ':''}${fmtDate(d)}</option>`).join('');
    sel.value = dates.includes(prev) ? prev : todayStr();
  }

  function asSentence(note){
    const s = String(note||'').trim();
    if(!s) return '';
    return /[.!?]$/.test(s) ? s : s + '.';
  }
  function fmtShort(iso){ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
  function externalTail(task){
    const dep = task.externalDependency;
    const name = personById(dep.personId)?.name || 'a colleague';
    const status = dep.notifiedAt ? 'no response yet' : 'email not sent yet';
    return `flagged to ${name} on ${fmtShort(dep.flaggedAt)} — ${status}`;
  }

  function buildReportText(dateStr){
    const done = tasks.filter(t=>t.completedAt && todayStr(new Date(t.completedAt))===dateStr)
      .sort((a,b)=>a.completedAt.localeCompare(b.completedAt));
    const blocked = tasks.filter(t=>t.status!=='done' && (isBlocked(t) || hasExternalBlock(t)));
    const inProgress = tasks.filter(t=>t.status==='inprogress' && !isBlocked(t) && !hasExternalBlock(t));

    let out = `Daily report — ${fmtDate(dateStr)}\n`;
    out += '='.repeat(28) + '\n\n';
    out += `${done.length} task${done.length===1?'':'s'} completed, ${inProgress.length} in progress, ${blocked.length} blocked.\n\n`;

    out += `Completed (${done.length})\n`;
    if(done.length){
      done.forEach(t=>{
        let s = `At ${fmtTime(t.completedAt)}, you completed ${t.title}. `;
        if(t.notes) s += asSentence(t.notes) + ' ';
        const pr = priorityOf(t);
        if(pr==='urgent'||pr==='high') s += `This was flagged ${priorityMeta(t).label}. `;
        const dependents = tasks.filter(x=>(x.dependsOn||[]).includes(t.id));
        if(dependents.length) s += `This unblocks: ${dependents.map(d=>d.title).join(', ')}.`;
        out += s.trim() + '\n\n';
      });
    } else {
      out += 'Nothing was marked done on this date.\n\n';
    }

    out += `In progress (${inProgress.length})\n`;
    if(inProgress.length){
      inProgress.forEach(t=>{
        let s = `${t.title} is in progress. `;
        if(t.notes) s += asSentence(t.notes) + ' ';
        const pr = priorityOf(t);
        if(pr==='urgent'||pr==='high') s += `This is flagged ${priorityMeta(t).label}.`;
        out += s.trim() + '\n\n';
      });
    } else {
      out += 'Nothing is in progress.\n\n';
    }

    out += `Blocked (${blocked.length})\n`;
    if(blocked.length){
      blocked.forEach(t=>{
        const taskBlockers = blockers(t);
        let s;
        if(taskBlockers.length){
          s = `${t.title} is blocked, waiting on ${taskBlockers.map(b=>b.title).join(', ')}`;
          s += hasExternalBlock(t) ? `, and ${externalTail(t)}.` : '.';
        } else if(hasExternalBlock(t)){
          s = `${t.title} is blocked, ${externalTail(t)}.`;
        } else {
          s = `${t.title} is blocked.`;
        }
        out += s + '\n\n';
      });
    } else {
      out += 'Nothing is blocked.\n\n';
    }
    return out.trimEnd() + '\n';
  }

  function renderReport(){
    const sel = document.getElementById('tt-report-date');
    const dateStr = sel.value || todayStr();
    document.getElementById('tt-report-box').textContent = buildReportText(dateStr);
  }

  document.getElementById('tt-report-date').addEventListener('change', renderReport);
  document.getElementById('tt-copy-report').addEventListener('click', ()=>{
    const text = document.getElementById('tt-report-box').textContent;
    navigator.clipboard.writeText(text).then(()=>{
      const btn = document.getElementById('tt-copy-report');
      const orig = btn.textContent; btn.textContent='Copied';
      setTimeout(()=>btn.textContent=orig, 1400);
    });
  });
  document.getElementById('tt-download-report').addEventListener('click', ()=>{
    const dateStr = document.getElementById('tt-report-date').value || todayStr();
    window.location.href = `/api/report/${dateStr}`;
  });

  function openModal(editId){
    const layer = document.getElementById('tt-modal-layer');
    const editing = editId ? tasks.find(t=>t.id===editId) : null;
    const otherTasks = tasks.filter(t=>t.id!==editId);
    const depOptions = otherTasks.map(t=>{
      const checked = editing && (editing.dependsOn||[]).includes(t.id) ? 'checked' : '';
      return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0;"><input type="checkbox" value="${t.id}" ${checked}/> ${escapeHtml(t.title)}</label>`;
    }).join('') || '<p style="font-size:12.5px;color:var(--ink-soft);">No other tasks yet to depend on.</p>';

    let extSection = '';
    if(editing){
      const dep = editing.externalDependency;
      if(dep && !dep.resolvedAt){
        const pName = personById(dep.personId)?.name || 'a colleague';
        extSection = `
          <div style="border-top:0.5px solid var(--line);margin-top:4px;padding-top:12px;margin-bottom:14px;">
            <label style="font-size:12px;color:var(--ink-soft);">Colleague dependency</label>
            <p style="font-size:12.5px;margin:6px 0 4px;">⏳ Waiting on <strong>${escapeHtml(pName)}</strong>${dep.notifiedAt?'':' <span style="color:var(--coral);">(email not sent)</span>'}</p>
            ${dep.note? `<p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 8px;">"${escapeHtml(dep.note)}"</p>`:''}
            <button class="tt-btn" id="tt-resolve-dep" style="font-size:12px;">Mark resolved</button>
          </div>`;
      } else {
        const personOpts = people.length
          ? people.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')
          : '<option value="">No colleagues yet</option>';
        extSection = `
          <div style="border-top:0.5px solid var(--line);margin-top:4px;padding-top:12px;margin-bottom:14px;">
            <label style="font-size:12px;color:var(--ink-soft);">Flag dependency on a colleague</label>
            <select class="tt-select" id="tt-dep-person" style="margin:4px 0 8px;font-size:13px;" ${people.length?'':'disabled'}>${personOpts}</select>
            <textarea class="tt-textarea" id="tt-dep-note" style="margin:0 0 8px;min-height:44px;" placeholder="What are you waiting on them for?"></textarea>
            <div style="display:flex;align-items:center;gap:8px;">
              <button class="tt-btn" id="tt-flag-dep" style="font-size:12px;" ${people.length?'':'disabled'}>Flag &amp; notify</button>
              <span id="tt-dep-status" style="font-size:12px;color:var(--ink-soft);"></span>
            </div>
            ${people.length?'':'<p style="font-size:12px;color:var(--ink-soft);margin:6px 0 0;">Add colleagues first via “Colleagues”.</p>'}
          </div>`;
      }
    }

    let chainBuilderSection = '';
    if(editing){
      const hasChain = Array.isArray(editing.chain) && editing.chain.length;
      chainBuilderSection = `
        <div style="border-top:0.5px solid var(--line);margin-top:4px;padding-top:12px;margin-bottom:14px;">
          <label style="font-size:12px;color:var(--ink-soft);">Dependency chain</label>
          <p style="font-size:12.5px;color:var(--ink-soft);margin:4px 0 8px;">${hasChain? `A ${editing.chain.length}-stage chain is set — advance it from the card.` : 'Track a multi-person handoff as an ordered chain.'}</p>
          <button class="tt-btn" id="tt-build-chain" style="font-size:12px;">${hasChain?'Rebuild chain':'Build a dependency chain'}</button>
        </div>`;
    }
    layer.innerHTML = `
    <div style="min-height:400px;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;position:absolute;inset:0;">
      <div style="background:var(--card);border-radius:14px;padding:1.25rem 1.5rem;width:360px;max-width:90vw;border:0.5px solid var(--line);max-height:90vh;overflow-y:auto;">
        <h3 style="font-size:16px;margin-bottom:12px;">${editing ? 'Edit task' : 'New task'}</h3>
        <label style="font-size:12px;color:var(--ink-soft);">Title</label>
        <input class="tt-input" id="tt-new-title" style="margin:4px 0 10px;" placeholder="Draft the Q3 summary" value="${editing ? escapeHtml(editing.title) : ''}"/>
        <label style="font-size:12px;color:var(--ink-soft);">Priority</label>
        <select class="tt-select" id="tt-new-priority" style="margin:4px 0 10px;">
          ${PRIORITIES.map(p=>`<option value="${p.key}" ${(editing?priorityOf(editing):'medium')===p.key?'selected':''}>${p.label}</option>`).join('')}
        </select>
        <label style="font-size:12px;color:var(--ink-soft);">Notes (optional)</label>
        <textarea class="tt-textarea" id="tt-new-notes" style="margin:4px 0 10px;min-height:56px;" placeholder="Any context for this task">${editing ? escapeHtml(editing.notes||'') : ''}</textarea>
        <label style="font-size:12px;color:var(--ink-soft);">Depends on</label>
        <div id="tt-dep-list" style="max-height:120px;overflow-y:auto;margin:4px 0 14px;">${depOptions}</div>
        ${extSection}
        ${chainBuilderSection}
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button class="tt-btn" id="tt-cancel">Cancel</button>
          <button class="tt-btn tt-btn-primary" id="tt-save">${editing ? 'Save changes' : 'Add task'}</button>
        </div>
      </div>
    </div>`;
    document.getElementById('tt-cancel').onclick = ()=>{ layer.innerHTML=''; };
    if(editing){
      const flagBtn = document.getElementById('tt-flag-dep');
      if(flagBtn) flagBtn.onclick = async ()=>{
        const personId = document.getElementById('tt-dep-person').value;
        if(!personId) return;
        const note = document.getElementById('tt-dep-note').value.trim();
        const statusEl = document.getElementById('tt-dep-status');
        statusEl.style.color='var(--ink-soft)';
        statusEl.textContent='Sending…';
        flagBtn.disabled = true;
        const result = await flagDependency(editing.id, personId, note, statusEl);
        if(result.ok && result.emailed){ openModal(editing.id); }
        else { flagBtn.disabled = false; }
      };
      const resolveBtn = document.getElementById('tt-resolve-dep');
      if(resolveBtn) resolveBtn.onclick = async ()=>{
        await resolveDependency(editing.id);
        openModal(editing.id);
      };
      const buildChainBtn = document.getElementById('tt-build-chain');
      if(buildChainBtn) buildChainBtn.onclick = ()=>openChainBuilder(editing.id);
    }
    document.getElementById('tt-save').onclick = ()=>{
      const title = document.getElementById('tt-new-title').value.trim();
      if(!title) return;
      const notes = document.getElementById('tt-new-notes').value.trim();
      const priority = document.getElementById('tt-new-priority').value;
      const deps = Array.from(layer.querySelectorAll('#tt-dep-list input:checked')).map(i=>i.value);
      if(editing){
        editing.title = title;
        editing.notes = notes;
        editing.priority = priority;
        editing.dependsOn = deps;
      } else {
        tasks.push({id:uid(), title, notes, priority, status:'todo', dependsOn:deps, createdAt:new Date().toISOString(), completedAt:null, externalDependency:null});
      }
      saveTasks(); render();
      layer.innerHTML='';
    };
  }
  document.getElementById('tt-add-btn').addEventListener('click', ()=>openModal());

  function openDependencyModal(taskId){
    const task = tasks.find(t=>t.id===taskId);
    if(!task || !task.externalDependency) return;
    const dep = task.externalDependency;
    const layer = document.getElementById('tt-modal-layer');
    const pName = personById(dep.personId)?.name || 'a colleague';
    layer.innerHTML = `
    <div style="min-height:400px;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;position:absolute;inset:0;">
      <div style="background:var(--card);border-radius:14px;padding:1.25rem 1.5rem;width:340px;max-width:90vw;border:0.5px solid var(--line);">
        <h3 style="font-size:16px;margin-bottom:10px;">Colleague dependency</h3>
        <p style="font-size:13px;margin:0 0 6px;">⏳ Waiting on <strong>${escapeHtml(pName)}</strong></p>
        ${dep.note? `<p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 6px;">"${escapeHtml(dep.note)}"</p>`:''}
        <p style="font-size:11.5px;font-family:var(--font-mono);color:var(--ink-soft);margin:0 0 4px;">Flagged ${fmtShort(dep.flaggedAt)}</p>
        <p style="font-size:11.5px;font-family:var(--font-mono);color:${dep.notifiedAt?'var(--teal)':'var(--coral)'};margin:0 0 14px;">${dep.notifiedAt? 'Email sent ' + fmtShort(dep.notifiedAt) : 'Email not sent'}</p>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button class="tt-btn" id="tt-dep-close">Close</button>
          <button class="tt-btn tt-btn-primary" id="tt-dep-resolve">Mark resolved</button>
        </div>
      </div>
    </div>`;
    document.getElementById('tt-dep-close').onclick = ()=>{ layer.innerHTML=''; };
    document.getElementById('tt-dep-resolve').onclick = async ()=>{
      await resolveDependency(taskId);
      layer.innerHTML='';
    };
  }

  function openPeopleModal(){
    const layer = document.getElementById('tt-modal-layer');
    function draw(){
      const rows = people.length
        ? people.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--line);">
            <span style="font-size:13px;">${escapeHtml(p.name)} <span style="color:var(--ink-soft);">· ${escapeHtml(p.email)}</span></span>
            <button class="tt-btn" data-del="${p.id}" style="font-size:11px;padding:3px 8px;color:var(--coral);">Remove</button>
          </div>`).join('')
        : '<p style="font-size:12.5px;color:var(--ink-soft);margin:8px 0;">No colleagues yet. Add one below.</p>';
      layer.innerHTML = `
      <div style="min-height:400px;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;position:absolute;inset:0;">
        <div style="background:var(--card);border-radius:14px;padding:1.25rem 1.5rem;width:400px;max-width:90vw;border:0.5px solid var(--line);">
          <h3 style="font-size:16px;margin-bottom:12px;">Colleagues</h3>
          <div style="max-height:220px;overflow-y:auto;margin-bottom:14px;">${rows}</div>
          <label style="font-size:12px;color:var(--ink-soft);">Add a colleague</label>
          <input class="tt-input" id="tt-person-name" style="margin:4px 0 8px;" placeholder="Name"/>
          <input class="tt-input" id="tt-person-email" style="margin:0 0 8px;" placeholder="email@company.com"/>
          <span id="tt-person-status" style="font-size:12px;color:var(--coral);"></span>
          <div style="display:flex;justify-content:space-between;gap:8px;margin-top:12px;">
            <button class="tt-btn tt-btn-primary" id="tt-person-add">Add</button>
            <button class="tt-btn" id="tt-person-close">Done</button>
          </div>
        </div>
      </div>`;
      document.getElementById('tt-person-close').onclick = ()=>{ layer.innerHTML=''; render(); };
      document.getElementById('tt-person-add').onclick = async ()=>{
        const name = document.getElementById('tt-person-name').value.trim();
        const email = document.getElementById('tt-person-email').value.trim();
        const statusEl = document.getElementById('tt-person-status');
        if(!name || !email){ statusEl.textContent='Name and email are both required.'; return; }
        try{
          const res = await fetch('/api/people', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ name, email })
          });
          if(!res.ok){ const d=await res.json(); statusEl.textContent=d.error||'Could not add colleague.'; return; }
          await loadPeople();
          draw();
        }catch(e){ statusEl.textContent='Network error.'; }
      };
      layer.querySelectorAll('[data-del]').forEach(btn=>{
        btn.onclick = async ()=>{
          await fetch(`/api/people/${btn.getAttribute('data-del')}`, { method:'DELETE' });
          await loadPeople();
          draw();
        };
      });
    }
    draw();
  }
  document.getElementById('tt-people-btn').addEventListener('click', openPeopleModal);

  function openChainBuilder(taskId){
    const task = tasks.find(t=>t.id===taskId);
    if(!task) return;
    const layer = document.getElementById('tt-modal-layer');
    let staged = (Array.isArray(task.chain) && task.chain.length)
      ? task.chain.map(s=>({ label:s.label, personId:s.personId }))
      : [{ label:'You', personId:null }];
    function draw(){
      const list = staged.map((s,i)=>`
        <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--line);">
          <span style="font-size:12px;font-family:var(--font-mono);color:var(--ink-soft);">${i+1}</span>
          <span style="font-size:13px;flex:1;">${escapeHtml(s.label)}${s.personId?'':' <span style="color:var(--ink-soft);">(you)</span>'}</span>
          ${i===0?'':`<button class="tt-btn" data-rm="${i}" style="font-size:11px;padding:2px 7px;color:var(--coral);">×</button>`}
        </div>`).join('');
      const opts = people.length
        ? people.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')
        : '<option value="">No colleagues yet</option>';
      layer.innerHTML = `
      <div style="min-height:400px;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;position:absolute;inset:0;">
        <div style="background:var(--card);border-radius:14px;padding:1.25rem 1.5rem;width:400px;max-width:90vw;border:0.5px solid var(--line);">
          <h3 style="font-size:16px;margin-bottom:6px;">Build dependency chain</h3>
          <p style="font-size:12px;color:var(--ink-soft);margin:0 0 12px;">Stages run in order. You are the first stage; add colleagues the work passes to.</p>
          <div style="margin-bottom:12px;">${list}</div>
          <div style="display:flex;gap:6px;margin-bottom:14px;">
            <select class="tt-select" id="tt-chain-person" style="flex:1;font-size:13px;" ${people.length?'':'disabled'}>${opts}</select>
            <button class="tt-btn" id="tt-chain-add" ${people.length?'':'disabled'}>Add</button>
          </div>
          <div style="display:flex;justify-content:space-between;gap:8px;">
            <button class="tt-btn" id="tt-chain-cancel">Cancel</button>
            <button class="tt-btn tt-btn-primary" id="tt-chain-save" ${staged.length<2?'disabled':''}>Save chain</button>
          </div>
          ${staged.length<2?'<p style="font-size:11.5px;color:var(--ink-soft);margin:8px 0 0;">Add at least one colleague to form a chain.</p>':''}
          ${people.length?'':'<p style="font-size:11.5px;color:var(--ink-soft);margin:8px 0 0;">Add colleagues first via “Colleagues”.</p>'}
        </div>
      </div>`;
      document.getElementById('tt-chain-cancel').onclick = ()=>openModal(taskId);
      document.getElementById('tt-chain-add').onclick = ()=>{
        const pid = document.getElementById('tt-chain-person').value;
        if(!pid) return;
        const p = personById(pid);
        staged.push({ label: p?p.name:'Colleague', personId: pid });
        draw();
      };
      layer.querySelectorAll('[data-rm]').forEach(b=>{
        b.onclick = ()=>{ staged.splice(Number(b.getAttribute('data-rm')),1); draw(); };
      });
      document.getElementById('tt-chain-save').onclick = async ()=>{
        const now = new Date().toISOString();
        const chain = staged.map((s,i)=>({
          label: s.label,
          personId: s.personId || null,
          status: i===0 ? 'current' : 'pending',
          startedAt: i===0 ? now : null,
          completedAt: null,
          note: null
        }));
        const result = await setChain(taskId, chain);
        if(result.ok) openModal(taskId);
      };
    }
    draw();
  }

  async function init(){
    await loadPeople();
    await loadTasks();
  }
  init();
})();
</script>
</body>
</html>
